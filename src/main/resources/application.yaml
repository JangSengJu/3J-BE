spring:
  application:
    name: jjj
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_TTL:30m}
  refresh-expiration: ${JWT_REFRESH_TTL:14d}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  allowed-models: "${GEMINI_ALLOWED_MODELS:gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-flash-latest,gemini-flash-lite-latest}"
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout: ${GEMINI_TIMEOUT:60s}
  deadline: ${GEMINI_DEADLINE:30s}
  stream-idle-timeout: ${GEMINI_STREAM_IDLE_TIMEOUT:30s}
ai:
  executor:
    core-size: ${AI_EXECUTOR_CORE_SIZE:4}
    max-size: ${AI_EXECUTOR_MAX_SIZE:16}
    queue-size: ${AI_EXECUTOR_QUEUE_SIZE:32}
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:*,http://127.0.0.1:*,null}"
