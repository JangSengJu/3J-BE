spring:
  application:
    name: jjj
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_TTL:30m}
  refresh-expiration: ${JWT_REFRESH_TTL:14d}
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  allowed-models: "${GROQ_ALLOWED_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}"
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  timeout: ${GROQ_TIMEOUT:60s}
  deadline: ${GROQ_DEADLINE:30s}
  stream-idle-timeout: ${GROQ_STREAM_IDLE_TIMEOUT:30s}
ai:
  executor:
    core-size: ${AI_EXECUTOR_CORE_SIZE:4}
    max-size: ${AI_EXECUTOR_MAX_SIZE:16}
    queue-size: ${AI_EXECUTOR_QUEUE_SIZE:32}
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:*,http://127.0.0.1:*,null,https://triplej.cloud,https://*.triplej.cloud}"
